<header class="app-header">
  <div class="header-content">
    <div class="brand">
      <span class="brand-icon material-icons">local_fire_department</span>
      <span class="brand-title">Forged Heroes</span>
    </div>

    <nav class="top-menu" *ngIf="isLoggedIn">
      <button mat-icon-button matTooltip="Home" (click)="navigateTo('/home')">
        <span class="material-icons">home</span>
      </button>

      <button mat-icon-button matTooltip="Games" (click)="navigateTo('/games')">
        <span class="material-icons">sports_esports</span>
      </button>

      <button mat-icon-button matTooltip="Account" (click)="navigateTo('/account')">
        <span class="material-icons">person</span>
      </button>

      <button mat-icon-button matTooltip="Privacy Policy" (click)="navigateTo('/privacy')">
        <span class="material-icons">policy</span>
      </button>

      <button mat-icon-button matTooltip="Log Out" (click)="logout()">
        <span class="material-icons">logout</span>
      </button>
    </nav>
  </div>
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
