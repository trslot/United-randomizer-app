<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header class="auth-header">
      <mat-card-title>Forged Heroes</mat-card-title>
      <mat-card-subtitle>
        {{ showRegisterForm ? 'Create your account' : 'Sign in to continue' }}
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="auth-content">
      <!-- Login -->
      <div *ngIf="!showRegisterForm" class="auth-form">
        <div class="google-section">
          <p class="section-label">Sign in with</p>
          <button type="button" class="google-button" mat-stroked-button (click)="loginWithGoogle()">
            <mat-icon svgIcon="google"></mat-icon>
            <span>Continue with Google</span>
          </button>
        </div>

        <div class="divider">
          <span>or</span>
        </div>

        <form (ngSubmit)="loginWithEmailPassword()">
          <div class="form-fields">
            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <mat-icon matPrefix>email</mat-icon>
              <input matInput type="email" [(ngModel)]="email" name="email" autocomplete="email" required>
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Password</mat-label>
              <mat-icon matPrefix>lock</mat-icon>
              <input matInput type="password" [(ngModel)]="password" name="password" autocomplete="current-password" required>
            </mat-form-field>
          </div>

          <div *ngIf="errorMessage" class="error-message">
            <mat-icon>error_outline</mat-icon>
            <span>{{ errorMessage }}</span>
          </div>

          <button mat-raised-button class="submit-button" type="submit">
            <mat-icon>login</mat-icon>
            Login
          </button>
        </form>

        <div class="switch-auth">
          <span>Don't have an account?</span>
          <button mat-button class="forge-link" type="button" (click)="toggleRegisterForm()">
            Create an account
          </button>
        </div>
      </div>

      <!-- Register -->
      <div *ngIf="showRegisterForm" class="auth-form">
        <form (ngSubmit)="register()">
          <div class="form-fields">
            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <mat-icon matPrefix>email</mat-icon>
              <input matInput type="email" [(ngModel)]="email" name="email" autocomplete="email" required>
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Password</mat-label>
              <mat-icon matPrefix>lock</mat-icon>
              <input matInput type="password" [(ngModel)]="password" name="password" autocomplete="new-password" minlength="6" required>
            </mat-form-field>
          </div>

          <div *ngIf="errorMessage" class="error-message">
            <mat-icon>error_outline</mat-icon>
            <span>{{ errorMessage }}</span>
          </div>

          <button mat-raised-button class="submit-button" type="submit">
            <mat-icon>person_add</mat-icon>
            Create Account
          </button>
        </form>

        <div class="switch-auth">
          <span>Already have an account?</span>
          <button mat-button class="forge-link" type="button" (click)="toggleRegisterForm()">
            Back to Login
          </button>
        </div>
      </div>
    </mat-card-content>

    <mat-card-footer class="auth-footer">
      <button mat-button class="privacy-button" (click)="navigateTo('/privacy')">
        <mat-icon>policy</mat-icon>
        Privacy Policy
      </button>
    </mat-card-footer>
  </mat-card>
</div>
